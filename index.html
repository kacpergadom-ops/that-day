<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THAT DAY</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Warstwa zdjęcia i rozmytego tła -->
    <div class="photo-container" id="photo-container"></div>

    <!-- Główny interfejs (nakładka) -->
    <main class="ui-layer">
        
        <header>
            <h1 class="logo">THAT DAY</h1>
            <button class="menu-toggle" id="menu-toggle">Menu</button>
        </header>

        <nav class="photo-nav">
            <button class="nav-btn prev" id="prev-btn">←</button>
            <button class="nav-btn next" id="next-btn">→</button>
        </nav>

        <footer>
            <div class="photo-info">
                <span class="location" id="location-text">Pobieranie...</span>
                <span class="date" id="date-text">--.--.----</span>
            </div>
        </footer>

    </main>

    <!-- Ukryte menu -->
    <div class="overlay-menu" id="overlay-menu">
        <button class="close-menu" id="close-menu">✕</button>
        <ul class="menu-links">
            <li><a href="#">Zdjęcia</a></li>
            <li><a href="#">Kalendarz</a></li>
            <li><a href="#">O mnie</a></li>
            <li><a href="#">Instagram</a></li>
        </ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
