<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THAT DAY</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Warstwa zdjęcia i tła -->
    <div class="photo-wrapper">
        <div class="photo-blur-bg" id="photo-blur-bg"></div>
        <img class="photo-main" id="photo-main" src="" alt="That Day Photo">
    </div>

    <!-- Główny interfejs -->
    <main class="ui-layer">
        
        <header>
            <h1 class="logo" id="logo">THAT DAY</h1>
            <button class="menu-toggle" id="menu-toggle">Menu</button>
        </header>

        <nav class="photo-nav">
            <button class="nav-btn prev" id="prev-btn">←</button>
            <button class="nav-btn next" id="next-btn">→</button>
        </nav>

        <footer>
            <div class="photo-info">
                <span class="location" id="location-text">Ładowanie...</span>
                <span class="date" id="date-text">--.--.----</span>
            </div>
        </footer>

    </main>

    <!-- Rozmyte menu nakładkowe -->
    <div class="overlay-menu" id="overlay-menu">
        <button class="close-menu" id="close-menu">✕</button>
        
        <!-- Widok główny menu -->
        <div class="menu-content" id="menu-content">
            <ul class="menu-links">
                <li><a href="#" id="link-photos">Zdjęcia</a></li>
                <li><a href="#" id="link-calendar">Kalendarz</a></li>
                <li><a href="#">O mnie</a></li>
                <li><a href="#">Instagram</a></li>
            </ul>
        </div>

        <!-- Widok kalendarza wewnątrz menu -->
        <div class="calendar-content hidden" id="calendar-content">
            <button class="back-to-menu" id="back-to-menu">← Powrót</button>
            <h2 class="calendar-title">KALENDARZ</h2>
            <div class="calendar-grid" id="calendar-grid"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
